name: Deploy dashboard to Netlify

on:
  push:
    branches:
      - main
    paths:
      - "frontend/dashboard/**"
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: |
          cd frontend/dashboard
          npm install

      - name: Build dashboard
        run: |
          cd frontend/dashboard
          npm run build

      # Uncomment and configure this if you want CI to deploy to Netlify:
      # - name: Deploy to Netlify
      #   uses: netlify/actions/cli@v4
      #   env:
      #     NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      #     NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      #   with:
      #     # For Next.js SSR, use .next
      #     # For static export (next export), use out
      #     # Set this to your actual output directory:
      #     args: deploy --dir=frontend/dashboard/.next --prod
