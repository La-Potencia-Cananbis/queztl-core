version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - cd mobile-app && pnpm install
    build:
      commands:
        - cd mobile-app && pnpm --filter web build
  artifacts:
    baseDirectory: mobile-app/apps/web/dist
    files:
      - "**/*"
  cache:
    paths:
      - "node_modules/**/*"
      - "**/node_modules/**/*"
