version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - cd mobile-app && pnpm install --no-frozen-lockfile
        - echo "Listing installed packages:"
        - cd mobile-app && pnpm list --depth=0
    build:
      commands:
        - cd mobile-app/apps/web && pnpm build
        - cd "${CODEBUILD_SRC_DIR:-.}/mobile-app" && pnpm install
    build:
      commands:
        - cd "${CODEBUILD_SRC_DIR:-.}/mobile-app" && pnpm --filter web build
  artifacts:
    baseDirectory: mobile-app/apps/web/dist
    files:
      - "**/*"
  cache:
    paths:
      - "mobile-app/node_modules/**/*"
      - "mobile-app/apps/web/node_modules/**/*"
