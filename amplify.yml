version: 1
frontend:
  phases:
    preBuild:
      commands:
        - corepack enable
        - pnpm install
    build:
      commands:
        - pnpm --filter web build
  artifacts:
    baseDirectory: mobile-app/apps/web/dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - **/node_modules/**/*
