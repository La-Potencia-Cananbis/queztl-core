<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚩 Communist Theory Library</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a0000 0%, #4a0000 50%, #1a0000 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 3px solid #cc0000;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 3em;
            color: #ff0000;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
        }

        .tagline {
            font-size: 1.2em;
            font-style: italic;
            color: #ffcccc;
        }

        .search-section {
            background: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border: 2px solid #cc0000;
            margin-bottom: 30px;
        }

        .search-box {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            background: #1a0000;
            color: #fff;
            border: 2px solid #cc0000;
            border-radius: 5px;
            margin-bottom: 15px;
        }

        .filters {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .filter-group {
            flex: 1;
            min-width: 200px;
        }

        .filter-group label {
            display: block;
            margin-bottom: 5px;
            color: #ffcccc;
            font-weight: bold;
        }

        select {
            width: 100%;
            padding: 10px;
            background: #1a0000;
            color: #fff;
            border: 2px solid #cc0000;
            border-radius: 5px;
            font-size: 1em;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.7);
            padding: 20px;
            border: 2px solid #cc0000;
            text-align: center;
        }

        .stat-number {
            font-size: 3em;
            color: #ff0000;
            font-weight: bold;
        }

        .stat-label {
            color: #ffcccc;
            margin-top: 5px;
        }

        .library-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
        }

        .text-card {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #cc0000;
            padding: 25px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .text-card:hover {
            transform: translateY(-5px);
            border-color: #ff0000;
            box-shadow: 0 10px 30px rgba(255, 0, 0, 0.3);
        }

        .text-card.foundational {
            border-color: #ffaa00;
        }

        .text-card.essential {
            border-color: #ff0000;
        }

        .text-card.advanced {
            border-color: #aa0000;
        }

        .importance-badge {
            display: inline-block;
            padding: 5px 15px;
            background: #cc0000;
            color: #fff;
            font-size: 0.8em;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .foundational .importance-badge {
            background: #ffaa00;
            color: #000;
        }

        .advanced .importance-badge {
            background: #aa0000;
        }

        .text-title {
            font-size: 1.4em;
            color: #ff0000;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .text-authors {
            color: #ffcccc;
            font-style: italic;
            margin-bottom: 10px;
        }

        .text-year {
            color: #ff9999;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .topics {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .topic-tag {
            background: rgba(204, 0, 0, 0.3);
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.85em;
            border: 1px solid #cc0000;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-content {
            max-width: 900px;
            margin: 0 auto;
            background: #1a0000;
            border: 3px solid #cc0000;
            padding: 40px;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2em;
            color: #ff0000;
            cursor: pointer;
            background: none;
            border: none;
        }

        .no-results {
            text-align: center;
            padding: 60px;
            color: #ffcccc;
            font-size: 1.3em;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>🚩 Communist Theory Library</h1>
            <p class="tagline">"Workers of the world, unite!"</p>
        </header>

        <div class="stats" id="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalTexts">10</div>
                <div class="stat-label">Foundational Texts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalAuthors">4</div>
                <div class="stat-label">Revolutionary Authors</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalTopics">28</div>
                <div class="stat-label">Theoretical Topics</div>
            </div>
        </div>

        <div class="search-section">
            <input type="text" class="search-box" id="searchBox" placeholder="Search by title, author, or topic...">

            <div class="filters">
                <div class="filter-group">
                    <label>Author</label>
                    <select id="authorFilter">
                        <option value="">All Authors</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Topic</label>
                    <select id="topicFilter">
                        <option value="">All Topics</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Importance</label>
                    <select id="importanceFilter">
                        <option value="">All Levels</option>
                        <option value="foundational">Foundational</option>
                        <option value="essential">Essential</option>
                        <option value="introductory">Introductory</option>
                        <option value="advanced">Advanced</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="library-grid" id="libraryGrid"></div>

        <div class="no-results" id="noResults" style="display: none;">
            No texts found matching your search criteria.
        </div>
    </div>

    <div class="modal" id="textModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()">×</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const LIBRARY_DATA = {
            "manifesto": {
                "title": "The Communist Manifesto",
                "authors": ["Karl Marx", "Friedrich Engels"],
                "year": 1848,
                "url": "https://www.marxists.org/archive/marx/works/download/pdf/Manifesto.pdf",
                "topics": ["class_struggle", "historical_materialism", "revolution"],
                "importance": "foundational",
                "summary": "The foundational text of communist theory, analyzing class struggle throughout history and calling for proletarian revolution."
            },
            "capital_vol1": {
                "title": "Capital, Volume I",
                "authors": ["Karl Marx"],
                "year": 1867,
                "url": "https://www.marxists.org/archive/marx/works/download/pdf/Capital-Volume-I.pdf",
                "topics": ["political_economy", "surplus_value", "commodity_fetishism"],
                "importance": "foundational",
                "summary": "Marx's masterwork analyzing capitalist production, the extraction of surplus value, and the nature of commodities."
            },
            "state_and_revolution": {
                "title": "The State and Revolution",
                "authors": ["Vladimir Lenin"],
                "year": 1917,
                "url": "https://www.marxists.org/ebooks/lenin/state-and-revolution.pdf",
                "topics": ["state_theory", "dictatorship_proletariat", "revolution"],
                "importance": "essential",
                "summary": "Lenin's analysis of the state as an instrument of class rule and the necessity of its overthrow."
            },
            "reform_or_revolution": {
                "title": "Reform or Revolution",
                "authors": ["Rosa Luxemburg"],
                "year": 1900,
                "url": "https://www.marxists.org/archive/luxemburg/1900/reform-revolution/",
                "topics": ["reformism", "revolutionary_strategy", "social_democracy"],
                "importance": "essential",
                "summary": "Luxemburg's critique of reformism and defense of revolutionary socialism against gradualist approaches."
            },
            "wage_labor_capital": {
                "title": "Wage Labor and Capital",
                "authors": ["Karl Marx"],
                "year": 1847,
                "url": "https://www.marxists.org/archive/marx/works/download/pdf/wage-labour-capital.pdf",
                "topics": ["wages", "exploitation", "capitalism"],
                "importance": "introductory",
                "summary": "An accessible introduction to Marx's economic theory, explaining how wages and capital function under capitalism."
            },
            "socialism_utopian_scientific": {
                "title": "Socialism: Utopian and Scientific",
                "authors": ["Friedrich Engels"],
                "year": 1880,
                "url": "https://www.marxists.org/archive/marx/works/download/Engels_Socialism_Utopian_and_Scientific.pdf",
                "topics": ["scientific_socialism", "materialism", "dialectics"],
                "importance": "introductory",
                "summary": "Engels distinguishes scientific socialism from utopian idealism, explaining historical materialism."
            },
            "imperialism": {
                "title": "Imperialism, the Highest Stage of Capitalism",
                "authors": ["Vladimir Lenin"],
                "year": 1916,
                "url": "https://www.marxists.org/ebooks/lenin/imperialism-the-highest-stage-of-capitalism.pdf",
                "topics": ["imperialism", "monopoly_capitalism", "finance_capital"],
                "importance": "essential",
                "summary": "Lenin's analysis of imperialism as the monopoly stage of capitalism, driven by finance capital."
            },
            "german_ideology": {
                "title": "The German Ideology",
                "authors": ["Karl Marx", "Friedrich Engels"],
                "year": 1845,
                "url": "https://www.marxists.org/archive/marx/works/download/Marx_The_German_Ideology.pdf",
                "topics": ["historical_materialism", "ideology", "philosophy"],
                "importance": "foundational",
                "summary": "Marx and Engels develop their theory of historical materialism and critique idealist philosophy."
            },
            "origin_family": {
                "title": "The Origin of the Family, Private Property and the State",
                "authors": ["Friedrich Engels"],
                "year": 1884,
                "url": "https://www.marxists.org/archive/marx/works/download/pdf/origin_family.pdf",
                "topics": ["family", "patriarchy", "property", "state_formation"],
                "importance": "essential",
                "summary": "Engels traces the development of the family, private property, and the state from primitive communism."
            },
            "accumulation_capital": {
                "title": "The Accumulation of Capital",
                "authors": ["Rosa Luxemburg"],
                "year": 1913,
                "url": "https://www.marxists.org/archive/luxemburg/1913/accumulation-capital/",
                "topics": ["imperialism", "capital_accumulation", "colonialism"],
                "importance": "advanced",
                "summary": "Luxemburg's analysis of capital accumulation and the necessity of imperialism for capitalist expansion."
            }
        };

        let currentFilter = {
            search: '',
            author: '',
            topic: '',
            importance: ''
        };

        function init() {
            populateFilters();
            renderLibrary();
            setupEventListeners();
        }

        function populateFilters() {
            // Authors
            const authors = new Set();
            const topics = new Set();

            Object.values(LIBRARY_DATA).forEach(text => {
                text.authors.forEach(author => authors.add(author));
                text.topics.forEach(topic => topics.add(topic));
            });

            const authorSelect = document.getElementById('authorFilter');
            Array.from(authors).sort().forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                authorSelect.appendChild(option);
            });

            const topicSelect = document.getElementById('topicFilter');
            Array.from(topics).sort().forEach(topic => {
                const option = document.createElement('option');
                option.value = topic;
                option.textContent = topic.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                topicSelect.appendChild(option);
            });
        }

        function setupEventListeners() {
            document.getElementById('searchBox').addEventListener('input', (e) => {
                currentFilter.search = e.target.value.toLowerCase();
                renderLibrary();
            });

            document.getElementById('authorFilter').addEventListener('change', (e) => {
                currentFilter.author = e.target.value;
                renderLibrary();
            });

            document.getElementById('topicFilter').addEventListener('change', (e) => {
                currentFilter.topic = e.target.value;
                renderLibrary();
            });

            document.getElementById('importanceFilter').addEventListener('change', (e) => {
                currentFilter.importance = e.target.value;
                renderLibrary();
            });
        }

        function filterTexts() {
            return Object.entries(LIBRARY_DATA).filter(([id, text]) => {
                // Search filter
                if (currentFilter.search) {
                    const searchLower = currentFilter.search;
                    const matchTitle = text.title.toLowerCase().includes(searchLower);
                    const matchAuthor = text.authors.some(a => a.toLowerCase().includes(searchLower));
                    const matchTopic = text.topics.some(t => t.toLowerCase().includes(searchLower));
                    if (!matchTitle && !matchAuthor && !matchTopic) return false;
                }

                // Author filter
                if (currentFilter.author && !text.authors.includes(currentFilter.author)) {
                    return false;
                }

                // Topic filter
                if (currentFilter.topic && !text.topics.includes(currentFilter.topic)) {
                    return false;
                }

                // Importance filter
                if (currentFilter.importance && text.importance !== currentFilter.importance) {
                    return false;
                }

                return true;
            });
        }

        function renderLibrary() {
            const grid = document.getElementById('libraryGrid');
            const noResults = document.getElementById('noResults');
            const filteredTexts = filterTexts();

            if (filteredTexts.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            grid.innerHTML = filteredTexts.map(([id, text]) => `
                <div class="text-card ${text.importance}" onclick="showText('${id}')">
                    <span class="importance-badge">${text.importance}</span>
                    <div class="text-title">${text.title}</div>
                    <div class="text-authors">${text.authors.join(', ')}</div>
                    <div class="text-year">${text.year}</div>
                    <div class="topics">
                        ${text.topics.map(topic =>
                `<span class="topic-tag">${topic.replace(/_/g, ' ')}</span>`
            ).join('')}
                    </div>
                </div>
            `).join('');
        }

        function showText(id) {
            const text = LIBRARY_DATA[id];
            const modal = document.getElementById('textModal');
            const body = document.getElementById('modalBody');

            body.innerHTML = `
                <span class="importance-badge">${text.importance}</span>
                <h2 style="color: #ff0000; margin: 20px 0;">${text.title}</h2>
                <p style="color: #ffcccc; font-style: italic; margin-bottom: 10px;">
                    ${text.authors.join(', ')}
                </p>
                <p style="color: #ff9999; font-weight: bold; margin-bottom: 20px;">
                    Published: ${text.year}
                </p>
                <p style="line-height: 1.8; margin-bottom: 20px;">
                    ${text.summary}
                </p>
                <div class="topics" style="margin-bottom: 20px;">
                    ${text.topics.map(topic =>
                `<span class="topic-tag">${topic.replace(/_/g, ' ')}</span>`
            ).join('')}
                </div>
                <a href="${text.url}" target="_blank" 
                   style="display: inline-block; padding: 15px 30px; background: #cc0000; 
                          color: #fff; text-decoration: none; font-weight: bold; border-radius: 5px;">
                    📖 Read Full Text
                </a>
            `;

            modal.style.display = 'block';
        }

        function closeModal() {
            document.getElementById('textModal').style.display = 'none';
        }

        window.onclick = function (event) {
            const modal = document.getElementById('textModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        init();
    </script>
</body>

</html>
